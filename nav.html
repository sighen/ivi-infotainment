<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IVI - Navigation</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/nav.css" />
</head>
<body data-page="nav">
  <div class="dashboard-bg">
    <div class="tablet-frame">
      <div class="tablet-screen">
        <div id="app">
          <script>
            (function () {
              var direction = sessionStorage.getItem('ivi_nav_direction');
              sessionStorage.removeItem('ivi_nav_direction');
              document.getElementById('app').classList.add(direction === 'backward' ? 'enter-left' : 'enter-right');
            })();
          </script>
          <header id="statusbar" class="app-header">
            <span id="statusbar-time">--:--</span>
            <span id="statusbar-weather">-- --°</span>
          </header>

          <main class="nav-layout">
            <div id="search-input-row">
              <div class="search-input-wrap">
                <input id="search-input" type="text" placeholder="장소, 주소 검색" autocomplete="off" />
                <button id="search-clear-btn" type="button" class="hidden" aria-label="검색어 지우기">×</button>
              </div>
              <button id="search-submit-btn" type="button" aria-label="검색">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="11" cy="11" r="7" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
              </button>
            </div>
            <div class="nav-body">
              <div id="search-panel">
                <div id="selected-destination" class="hidden">
                  <button id="destination-back-btn" type="button" aria-label="목록으로 돌아가기">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="15 18 9 12 15 6" />
                    </svg>
                    <span>목록으로</span>
                  </button>
                  <div class="selected-name"></div>
                  <div class="selected-address"></div>
                  <div id="route-info" class="hidden"></div>
                  <div class="route-actions">
                    <button id="route-guide-btn" type="button">경로 안내</button>
                    <button id="route-cancel-btn" type="button" class="hidden">취소</button>
                  </div>
                </div>
                <ul id="search-result-list"></ul>
              </div>
              <div id="map-container"></div>
            </div>
          </main>

          <footer>
            <button id="home-btn" class="footer-btn" onclick="AppRouter.goTo('main')">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 11l9-8 9 8" />
                <path d="M5 10v10h5v-6h4v6h5V10" />
              </svg>
              <span>Home</span>
            </button>
            <button id="nav-btn" class="footer-btn menu-active" onclick="AppRouter.goTo('nav')">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <polygon points="16 8 14 14 8 16 10 10 16 8" />
              </svg>
              <span>내비게이션</span>
            </button>
            <button id="weather-btn" class="footer-btn" onclick="AppRouter.goTo('weather')">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <line x1="12" y1="2" x2="12" y2="4" />
                <line x1="12" y1="20" x2="12" y2="22" />
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34" />
                <line x1="17.66" y1="17.66" x2="19.07" y2="19.07" />
                <line x1="2" y1="12" x2="4" y2="12" />
                <line x1="20" y1="12" x2="22" y2="12" />
                <line x1="4.93" y1="19.07" x2="6.34" y2="17.66" />
                <line x1="17.66" y1="6.34" x2="19.07" y2="4.93" />
              </svg>
              <span>날씨</span>
            </button>
          </footer>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/map.js"></script>
  <script src="js/search.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.MapModule.init('map-container');
      window.MapModule.locateCurrent();
    });
  </script>
</body>
</html>
